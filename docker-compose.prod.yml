# Production / home-server overlay.
#
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Two differences from the development file, both about not publishing things.
#
# 1. THE BACKEND PUBLISHES NO HOST PORT. It is an internal service; nginx reaches
#    it as `backend:8000` on the compose network. The dev file publishes it for
#    debugging, and on a shared machine that is one more port to collide over —
#    plus anything published is reachable from the LAN, which for an API holding
#    every secret in the system is not a debugging convenience worth having.
#
# 2. THE FRONTEND IS REACHABLE ONLY FROM LOCALHOST. cloudflared connects from the
#    same host, so binding 127.0.0.1 keeps the app off the LAN entirely while the
#    tunnel still works. Set FRONTEND_PORT to something free — see the port
#    survey in docs/SERVER-INFRASTRUCTURE.md.
#
# 3. THE BACKEND RUNS THE IMAGE, NOT THE HOST CHECKOUT. The dev file bind-mounts
#    backend/app, tests and alembic for a fast edit loop; here those mounts are
#    reset, so what deploys is what `docker compose build` produced and the
#    migrations that run at start are the image's (review BE-08, 2026-10-24).
#    The fixtures mount is also dropped: production storage is Azure.
#
# (A `docker-compose.tunnel.yml` for a containerised cloudflared was planned and
# never written; if it is, it joins this network and needs no published port.)

services:
  backend:
    # Compose *appends* ports and volumes across files, so clearing needs !reset
    # (Compose v2.24+). Without it the dev mapping survives the override.
    ports: !reset []
    volumes: !reset []

  frontend:
    # !override replaces the list rather than appending to it. Loopback only:
    # cloudflared runs on this host, and nothing else needs to reach the app.
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
