# Security headers for every response. Included from each `location` in
# nginx.conf, because nginx `add_header` is NOT inherited into a location that
# declares its own add_header — putting these once at server level silently
# dropped them from /assets/ and / (review FE-05b, 2026-10-24).
#
# CSP notes: the app is a Vite build with no inline scripts; Leaflet injects
# inline styles (hence style-src 'unsafe-inline'); tiles come from
# openstreetmap.org; audio and the API are same-origin via nginx.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; media-src 'self' blob:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
