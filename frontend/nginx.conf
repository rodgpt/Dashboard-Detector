server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Docker's embedded DNS, so a backend restart does not permanently 502 us.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio clips are proxied through the API from private storage
        # (R-5.4/R-5.5) and can be several MB. Do not buffer them into nginx.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Hashed Vite bundles — safe to cache forever (filename changes every build)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. index.html always revalidates so a new build is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
