[alembic]
script_location = alembic
# `app` lives at the working directory, not on the default path.
prepend_sys_path = .
# The URL is injected from app.core.config at runtime (R-1.3: config comes from
# the environment, never baked in). The line below is a placeholder that alembic
# requires to exist; env.py overwrites it.
sqlalchemy.url = postgresql+psycopg://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
